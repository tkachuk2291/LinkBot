services:
  bot:
    build: .
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      - BROWSER_PROFILE=/browser/.config/chromium/Default
    volumes:
      - /home/server/linkbot-browser:/browser:ro
      - /home/server/linkbot-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  browser:
    image: lscr.io/linuxserver/chromium:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Kyiv
      - CUSTOM_USER=${BROWSER_USER:-admin}
      - PASSWORD=${BROWSER_PASSWORD:?задай BROWSER_PASSWORD в .env}
      - CHROME_CLI=--password-store=basic
    volumes:
      - /home/server/linkbot-browser:/config
    ports:
      - 127.0.0.1:3000:3000
    shm_size: 1gb
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
